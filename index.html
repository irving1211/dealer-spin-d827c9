<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>300SL spin test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --ink: #ece6da; --gold: #d8b27a; --mute: #8a847a; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .wrap { width: min(1200px, 100%); }
  .kicker { font-size: 12px; letter-spacing: .32em; text-transform: uppercase; color: var(--gold); }
  h1 { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: clamp(32px, 6vw, 56px); margin: 6px 0 18px; }
  .stage { position: relative; aspect-ratio: 16 / 9; cursor: grab; touch-action: pan-y; user-select: none; }
  .stage:active { cursor: grabbing; }
  .stage img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .hint { margin-top: 12px; font-size: 13px; color: var(--mute); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .bar { height: 1px; background: #2a2620; margin-top: 10px; position: relative; }
  .bar i { position: absolute; top: -1px; height: 3px; width: 8%; background: var(--gold); }
  .credit { margin-top: 28px; font-size: 11px; color: #5d584f; }
  .credit a { color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">1955 · Gullwing coupé</div>
  <h1>Walk around it.</h1>
  <div class="stage" id="stage"><img id="frame" alt="Silver 1950s gullwing coupé on a black showroom floor" src="frames/spin_000.webp"></div>
  <div class="bar"><i id="pos"></i></div>
  <div class="hint"><span>Drag to turn the car</span><span id="load">Loading 0/72</span></div>
  <p class="credit">3D car model: "Mercedes-Benz 300 SL Gullwing" by <a href="https://sketchfab.com/Lexyc16">Lexyc16</a>, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>, modified (logos removed, relit). Demo page, not a real listing.</p>
</div>
<script>
const N = 72, img = document.getElementById('frame'), stage = document.getElementById('stage');
const pos = document.getElementById('pos'), load = document.getElementById('load');
const src = i => `frames/spin_${String(i).padStart(3, '0')}.webp`;
const cache = []; let done = 0;
for (let i = 0; i < N; i++) { const im = new Image(); im.onload = () => { load.textContent = ++done < N ? `Loading ${done}/${N}` : 'Ready'; }; im.src = src(i); cache[i] = im; }
let f = 0, startX = 0, startF = 0, dragging = false;
const show = i => { f = ((i % N) + N) % N; img.src = cache[f].src; pos.style.left = (f / N * 92) + '%'; };
stage.addEventListener('pointerdown', e => { dragging = true; startX = e.clientX; startF = f; stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e => { if (!dragging) return; const px = stage.clientWidth / N * 1.6; show(startF - Math.round((e.clientX - startX) / px)); });
['pointerup', 'pointercancel'].forEach(t => stage.addEventListener(t, () => dragging = false));
</script>
</body>
</html>
